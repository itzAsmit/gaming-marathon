name: Keep Supabase Active

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to run it manually from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database API
        run: |
          curl --location --request GET 'https://dtsnfgpjefyrcwvzsmqv.supabase.co/rest/v1/players?limit=1' \
          --header 'apikey: ${{ secrets.SUPABASE_ANON_KEY }}' \
          --header 'Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}'
